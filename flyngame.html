<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素小熊跳仙人掌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #f7f7f7;
    font-family: -apple-system, "PingFang HK", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: manipulation;
  }
  .wrap {
    width: 100%;
    max-width: 760px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #535353;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 4px 8px 8px;
    user-select: none;
  }
  .hud b { color: #333; font-variant-numeric: tabular-nums; }
  .canvas-box {
    width: 100%;
    border-bottom: 2px solid #535353;
    position: relative;
    background: #fff;
    border-radius: 6px 6px 0 0;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; }
  .tip {
    margin-top: 14px;
    color: #9a9a9a;
    font-size: 13px;
    text-align: center;
    line-height: 1.7;
    user-select: none;
  }
  kbd {
    background: #eee; border: 1px solid #ddd; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #555;
    font-family: monospace;
  }
  .badge {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; color: #bbb; letter-spacing: 1px;
  }
  /* 手机萤幕掣 */
  .pad {
    width: 100%;
    display: none;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  .pad button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 20px 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fff;
    background: #535353;
    box-shadow: 0 4px 0 #333, 0 8px 18px rgba(0,0,0,.12);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .05s, box-shadow .05s;
  }
  .pad button:active,
  .pad button.on {
    transform: translateY(4px);
    box-shadow: 0 0 0 #333, 0 3px 8px rgba(0,0,0,.12);
    background: #6f6f6f;
  }
  .pad .btn-jump { background: #4a8f4a; box-shadow: 0 4px 0 #2f5f2f, 0 8px 18px rgba(0,0,0,.12); }
  .pad .btn-jump:active, .pad .btn-jump.on { background: #5cae5c; box-shadow: 0 0 0 #2f5f2f, 0 3px 8px rgba(0,0,0,.12); }
  .pad .btn-duck { background: #d98a3d; box-shadow: 0 4px 0 #a5621f, 0 8px 18px rgba(0,0,0,.12); }
  .pad .btn-duck:active, .pad .btn-duck.on { background: #eaa457; box-shadow: 0 0 0 #a5621f, 0 3px 8px rgba(0,0,0,.12); }
  body.touch .pad { display: flex; }
  body.touch .tip .kb-line { display: none; }
  body.touch .tip .touch-line { display: block; }

  /* ---------- 旋轉掣 ---------- */
  #rotBtn {
    position: fixed; top: 10px; right: 10px; z-index: 50;
    width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1;
    background: #fff; color: #535353;
    border: 2px solid #c9c9c9; border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: transform .25s ease, background .2s;
  }
  #rotBtn:active { background: #f0f0f0; }
  #rotBtn.on { transform: rotate(90deg); background: #e8f2e8; border-color: #4a8f4a; }

  /* 打橫：將成個畫面轉 90 度並自動撐滿 */
  body.rot { overflow: hidden; }
  body.rot .wrap {
    /* 舊寫法用 inset:0 + margin:0，元素左上角貼住 (0,0)，
       旋轉前個中心喺 (100vh/2, 100vw/2)，同 viewport 中心 (100vw/2, 100vh/2) 唔同，
       rotate 又只會繞自己中心轉 → 成個畫面偏移 (100vh-100vw)/2。
       改成先 top/left 50% + translate(-50%,-50%) 置中，再 rotate 就啱。 */
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center center;
    width: 100vh; height: 100vw;
    max-width: 100vh; max-height: 100vw;
    display: flex; flex-direction: column;
    justify-content: center;
    margin: 0; padding: 0 4px;
    box-sizing: border-box;
    background: #fff;
  }
  body.rot .canvas-box { flex: 1; display: flex; align-items: center; }
  body.rot .canvas-box canvas { width: 100%; height: auto; }
  body.rot .pad { padding-bottom: 4px; }
  body.rot .tip { font-size: 11px; }
  .hard-tag { display: none; color: #c0392b; font-weight: 700; letter-spacing: .5px; }
  .hard-tag.on { display: inline-block; }
  .cut-tag { display: none; color: #e67e22; font-weight: 700; letter-spacing: .5px; }
  .cut-tag.on { display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高 <b id="best">0</b></span>
    <span id="hardTag" class="hard-tag">⚡ 反應極限</span>
    <span id="cutTag" class="cut-tag">⏱ 間隔 ×1.00</span>
  </div>
  <div class="canvas-box">
    <canvas id="game" width="1600" height="480"></canvas>
    <div class="badge">HI <span id="hiscore">0</span></div>
  </div>
  <div class="pad">
    <button class="btn-duck" id="btnDuck">蹲低 ↓</button>
    <button class="btn-jump" id="btnJump">跳 ↑</button>
  </div>
  <div class="tip">
    <span class="kb-line"><kbd>空格</kbd> / <kbd>↑</kbd> = 跳　·　按住 <kbd>↓</kbd> = 蹲低（雀仔一定要蹲，跳唔到过）<br></span>
    <span class="touch-line" style="display:none;">点「跳 ↑」跳过仙人掌，按住「蹲低 ↓」躲雀仔（一定要蹲）<br></span>
    撞到仙人掌或雀仔就 GAME OVER，再点一下即可重新开始<br>
    <span style="color:#e67e22;">⚠ 400 分起間隔時間線性收緊，1200 分到極限 ×0.50（後段幾乎必死）</span>
  </div>
</div>
<button id="rotBtn" title="打橫／打直">⟳</button>
<script>
(function () {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = 800, H = 240;              // 邏輯座標保持不變
  const SS = 2;                        // 超採樣：底層像素 ×2，成個畫面更精細
  cvs.width = W * SS; cvs.height = H * SS;
  ctx.scale(SS, SS);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const GROUND = H - 28;           // 地面 y
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const hiEl = document.getElementById('hiscore');
  const hardTag = document.getElementById('hardTag');
  const cutTag = document.getElementById('cutTag');

  const C = {
    ink: '#535353',
    light: '#f7f7f7',
    bg: '#ffffff',
    cloud: '#e8e8e8',
    cactus: '#4a8f4a',
    bird: '#6a6a6a'
  };

  // ---------------- 旋轉掣（打橫／打直） ----------------
  const rotBtn = document.getElementById('rotBtn');
  rotBtn.addEventListener('click', function (e) {
    e.stopPropagation();                 // 唔好當成遊戲「再玩一次」嘅點擊
    document.body.classList.toggle('rot');
    rotBtn.classList.toggle('on');
  });

  let best = +(localStorage.getItem('dino_best') || 0);
  bestEl.textContent = best;
  hiEl.textContent = best;

  // ---------------- 主角狀態（沿用恐龍嘅物理，外形換成小熊） ----------------
  const dino = {
    x: 70,
    y: GROUND,
    w: 44, h: 47,
    vy: 0,
    jumpV: -12.5,
    gravity: 0.65,
    grounded: true,
    ducking: false,
    runFrame: 0,
    dead: false,
    blink: 0
  };

  function jump() {
    if (dino.grounded && !dino.dead) {
      dino.vy = dino.jumpV;
      dino.grounded = false;
      dino.ducking = false;
    }
  }

  // ---------------- 世界状态 ----------------
  let obstacles = [];
  let clouds = [];
  let stars = [];   // 夜晚星星
  let speed = 7;
  const baseSpeed = 7;
  const maxSpeed = 15;
  let score = 0;
  let distance = 0;
  let state = 'start';  // start | play | over
  let deathT = 0;       // 死後靈魂飄走嘅計時
  let dayNight = 0;     // 昼夜循环计时
  let isNight = false;

  function spawnCloud() {
    clouds.push({
      x: W + 20,
      y: 30 + Math.random() * 90,
      s: 0.4 + Math.random() * 0.5,
      scale: 0.7 + Math.random() * 0.6
    });
  }

  let spawnTotal = 0;   // 累計生成過幾多個障礙（連跳組都計）
  let birdTotal  = 0;   // 累計生成過幾多隻雀仔

  function spawnObstacle(force) {
    spawnTotal++;       // 每次呼叫 = 一個障礙
    if (force === 'bird') {
      // 換鍵關專用：強制雀仔（一樣係必蹲高度），計入配額等 20% 唔會走樣
      birdTotal++;
      obstacles.push({
        type: 'bird', x: W + 10, y: GROUND - 32,
        w: 40, h: 20, wing: 0, passed: false
      });
      return;
    }
    if (force === 'cactus') {
      // 連跳關專用：強制單株、偏矮仙人掌
      // 兩次都係純「跳」就得，唔會夾雜要蹲嘅雀仔，亦唔會闊到過唔到
      obstacles.push({
        type: 'cactus',
        x: W + 10, y: GROUND, w: 17, h: 28 + Math.random() * 10,
        cluster: 1, passed: false, combo: true
      });
      return;
    }
    // 雀仔目標佔比寫死 20%（唔隨速度／分數／Hardcore 變）。
    //
    // 點解唔係直接 Math.random() < 0.20：連跳組兩棵（Hardcore 仲有三棵）
    // 都強制仙人掌、唔擲骰，會把雀仔稀釋到實測得 6%。
    // 改用「累計配額」：睇返目前 birdTotal/spawnTotal 離 20% 差幾多，
    // 差幾多就補幾多，令玩家實際見到嘅障礙入面穩定 20% 係雀仔。
    // 下限 0.20（唔會無啦啦少過）、上限 1（連跳太密就補到夠）。
    const BIRD_RATE = 0.20;
    const deficit = BIRD_RATE * spawnTotal - birdTotal;
    const pBird = Math.min(1, Math.max(BIRD_RATE, deficit));
    if (Math.random() < pBird) {
      birdTotal++;
      // 統一高度：盒頂 GROUND-52、盒底 GROUND-32。
      // 企立碰撞箱約 GROUND-44 ~ GROUND-1 → 一定撞；
      // 蹲低碰撞箱約 GROUND-23 ~ GROUND-1 → 完全避得開（留約 9px 餘量）。
      // 唔再分低飛／高飛：低飛款舊時可以靠跳越過，正係要改走嘅 bug。
      obstacles.push({
        type: 'bird',
        x: W + 10,
        y: GROUND - 32,
        w: 40, h: 20,
        wing: 0,
        passed: false
      });
      return;
    }
    // 其餘 80% 係仙人掌，內部再分款式
    const r = Math.random();
    if (r < 0.80) {
      // 仙人掌：多数单株，少少机会一丛
      const cluster = Math.random() < 0.22 ? 2 : 1;
      const cw = 17 * cluster + (cluster - 1) * 4;
      obstacles.push({
        type: 'cactus',
        x: W + 10, y: GROUND, w: cw, h: 34 + Math.random() * 18,
        cluster, passed: false
      });
    } else {
      // 矮仙人掌（唔跳都会撞，必须跳）
      obstacles.push({
        type: 'cactus',
        x: W + 10, y: GROUND, w: 17, h: 24,
        cluster: 1, passed: false
      });
    }
  }

  function reset() {
    obstacles = [];
    clouds = [];
    stars = [];
    speed = baseSpeed;
    score = 0;
    distance = 0;
    dayNight = 0;
    isNight = false;
    dino.y = GROUND;
    dino.vy = 0;
    dino.grounded = true;
    dino.ducking = false;
    dino.dead = false;
    dino.runFrame = 0;
    deathT = 0;
    comboLeft = 0;
    spawnTotal = 0;
    birdTotal = 0;
    lastPattern = 'steady';
    lastType = 'cactus';
    switchPending = false;
    hardTag.classList.remove('on');
    cutTag.classList.remove('on');
    cutTag.textContent = '⏱ 間隔 ×1.00';
    state = 'play';
    for (let i = 0; i < 3; i++) spawnCloud();
    nextObstacle = 60;
  }

  let nextObstacle = 60;
  let comboLeft = 0;   // 連跳組仲要出幾多棵（0 / 1 / 2；2 = Hardcore 稀有三連跳）

  // ---------------- 間隔模型 ----------------
  // 絕對線：AIR_FRAMES = 38 幀 = 跳一次嘅滯空（jumpV -12.5 / gravity 0.65）。
  //   gap/speed ≤ 38 即未落地就要撞下一嚿 → 必死，任何難度都唔准踩。
  //
  // 用戶反饋「反應根本唔需要用到反應」嘅真正成因（實測捉到）：
  //   上一版 Hardcore 將所有倍率壓到 ~1.0、長空檔收起、窗口鎖死 47 幀，
  //   後段間隔全部擠喺 43~49 幀（CV 8.7%）→ 變成固定節拍，跟拍撳就得，
  //   完全唔使睇畫面。所以「更難」唔係再縮距離，而係要打散可預測性 +
  //   逼你喺極短窗口入面判斷「用邊個鍵」。
  const AIR_FRAMES     = 38;     // 跳躍滯空（幀）— 絕對唔准踩
  const GAP_DIST_START = 450;
  const GAP_DIST_END   = 350;
  const RAMP_DIST      = 55000;

  // ---------------- Hardcore 段：800 分之後先至開 ----------------
  // 800 分 ≈ 47s（speed 13.3）、1200 分 ≈ 64s（speed 封頂 15）。
  // 刻意「唔提速」：距離 = speed × 幀數，提速只會令畫面更疏。
  const HARDCORE_START = 800, HARDCORE_FULL = 1200;
  function hk() {
    return Math.min(1, Math.max(0, (score - HARDCORE_START) / (HARDCORE_FULL - HARDCORE_START)));
  }
  // 節奏／長檔用快曲線（800 分後約 4 秒全開）；反應窗口用慢曲線漸進收，唔會嚇一跳
  function hFast() { return Math.min(1, hk() * 6); }
  //
  // 反應窗口 15 → 6 幀（250ms → 100ms），大量間隔貼到 43 幀（落地後 83ms）。
  // 要坦白：100ms 已經低過人類「見到先撳」嘅簡單視覺反應（約 200~250ms），
  // 呢個級數唔係純反應，係靠「障礙一入畫面就預讀類型 + 落地瞬間換鍵」嘅肌肉記憶。
  // 仍然公平：障礙由 x=810 生成，到小熊有 ~47 幀預告時間，唔係突然弹出嚟。
  function humanFrames() { return 15 - 9 * hk(); }
  function safeFrames()  { return AIR_FRAMES + humanFrames(); }   // 53 → 44 幀

  // 微抖動：每個間隔再 -2~+7 幀，令「跟住拍子撳」彻底失效。
  // 抖動嘅目的係「散開」唔係「再壓低」，所以帶 minFrames 參數守住各自嘅地板，
  // 唔會無啦啦抖出個 42ms 嘅必死位；最小值仍由反應窗口／滯空線決定。
  function jitterGap(gap, minFrames) {
    const j = speed * (Math.random() * 9 - 4);       // -4 ~ +5 幀，略偏「更貼」
    return Math.max(speed * minFrames, gap + j);
  }

  function distBase() {
    const k = Math.min(1, distance / RAMP_DIST);   // 里程權重 0 → 1
    return GAP_DIST_START + (GAP_DIST_END - GAP_DIST_START) * k;
  }

  // ---------------- 節奏：長短有牌路 + 強制換鍵 ----------------
  //   tight   貼住地板（最密）
  //   steady  中等等待
  //   breath  長空檔（Cancel 咗一棵，抖一抖）
  //   double  連跳兩／三棵仙人掌
  //   switch  【新】下一棵強制同上一棵唔同類型 → 跳↔蹲即刻換鍵
  //
  // switch 係真正考「反應強度」嗰張牌：同樣短間隔，但要由「跳」切去「蹲」
  // （或相反），認知負荷遠大過同一個鍵撳兩次。只有 Hardcore 段先有。
  let lastPattern = 'steady';
  let lastType    = 'cactus';    // 上一棵嘅類型，用嚟決定 switch 要換去邊款
  let switchPending = false;     // 下一棵要強制相反類型

  function rhythmGap() {
    const k     = Math.min(1, distance / RAMP_DIST);
    const h     = hFast();
    const floor = speed * (safeFrames() + 0.5);
    const dist  = distBase() * (0.96 + Math.random() * 0.14);
    const base  = Math.max(dist, floor);                    // 距離做重心，時間做地板

    // Hardcore 全開：短關（double）+ 換鍵關（switch）+ 貼地（tight）合計 ~85%，
    // 大量間隔貼住 43 幀地板 → 落地後得返約 83ms；長檔只留少量做「打散」。
    // 唔可預測性唔靠時間，靠「下一棵係乜類型、要用邊個鍵」。
    const pSwitch = 0.26 * h;
    const pDouble = 0.22 + 0.16 * k + 0.10 * h;
    const rest    = 1 - pSwitch - pDouble;
    const pBreath = rest * 0.12;
    const pTight  = rest * 0.56;
    const r = Math.random();
    let kind, mul;
    if (lastPattern === 'breath') {
      kind = r < 0.62 ? 'tight' : 'steady';                // 啱啱抖完唔好再拖
    } else if (lastPattern === 'switch') {
      kind = r < 0.55 ? 'tight' : 'steady';                // 唔好連續換鍵換到癲
    } else if (lastPattern === 'double') {
      // 連跳完 14% 即刻換鍵（連按兩下 → 即刻蹲），最狠嗰種
      if (r < 0.14 * h)                    kind = 'switch';
      else if (r < 0.14 * h + 0.24)        kind = 'breath';
      else if (r < 0.14 * h + 0.62)        kind = 'tight';
      else                                  kind = 'steady';
    } else if (r < pSwitch)                       kind = 'switch';
    else if (r < pSwitch + pDouble)               kind = 'double';
    else if (r < pSwitch + pDouble + pBreath)      kind = 'breath';
    else if (r < pSwitch + pDouble + pBreath + pTight) kind = 'tight';
    else                                          kind = 'steady';

    // 倍率重新散開：上一版後段全部 1.0× 先至變成固定節拍。
    // 而家後段仍有 1.00 / 1.08~1.22 / 1.26~1.42 三檔，CV 由 5.6% 升到 10.7%，
    // 但長檔封頂 1.42×，唔會返去「距離太長冇難度」嗰個問題。
    switch (kind) {
      case 'tight':  mul = 1.00 + Math.random() * (0.05 - 0.01 * k); break;
      case 'steady': mul = 1.08 + Math.random() * (0.14 - 0.02 * k); break;
      case 'breath': mul = 1.26 + Math.random() * (0.16 - 0.02 * k); break;
      default:       mul = 1;                             // double / switch 用專用間隔
    }
    lastPattern = kind;
    // 微抖動加喺合併之後（唔會被 floor 食走），再守滯空絕對線
    return { gap: jitterGap(base * mul, safeFrames() - 1), kind };
  }

  // 連跳關：兩棵一齊入視線、有預告，硬線守滯空 + 7 幀
  function comboGap() {
    const k = Math.min(1, distance / RAMP_DIST);
    const h = hFast();
    const airFloor  = speed * (AIR_FRAMES + 9 - 2 * k - 2 * hk()); // 47 → 43 幀
    const normalMin = Math.max(distBase(), speed * (safeFrames() + 0.5));
    const mul = Math.random() < (0.55 + 0.25 * h) ? 0.72 : 0.88;
    return jitterGap(Math.max(airFloor, normalMin * mul * (0.97 + Math.random() * 0.06)), AIR_FRAMES + 5);
  }

  // 換鍵關：短過正常間隔，逼你落地即刻由跳轉蹲（或相反）
  function switchGap() {
    const h = hk();
    const airFloor  = speed * (AIR_FRAMES + 5 - 1.5 * h);   // 43 → 41.5 幀
    const normalMin = Math.max(distBase(), speed * (safeFrames() + 0.5));
    const mul = 0.74 + Math.random() * 0.16;
    return jitterGap(Math.max(airFloor, normalMin * mul * (0.97 + Math.random() * 0.06)), AIR_FRAMES + 3.5);
  }

  // ---------------- 400 → 1200 分：間隔「時間」線性收緊到 ×0.5 ----------------
  // nextObstacle 單位係 px，update() 每幀減 speed → 間隔時間 = gap / speed。
  // 乘一個倍率就係直接改時間，同速度無關。
  //
  //   score ≤ 400   → ×1.00（完全唔變）
  //   400 < score < 1200 → 線性 1.00 → 0.50，每 1 分跌 0.000625
  //   score ≥ 1200  → ×0.50（極限，封頂唔再落）
  //
  // 關鍵：呢一步刻意放喺所有 max() / jitterGap / airFloor **之後**，
  // 所以前面任何「滯空 38 幀」「反應地板」「安全網」都唔會食返呢個收緊。
  // 用戶上一輪揀咗「照字面 50%、唔加保底」，呢度只改「點樣去到 50%」，
  // 由一步跳變漸進曲線；終點後果照舊（短過滯空、未落地就撞），故意唔設防。
  const CUT_START = 400, CUT_END = 1200, CUT_MIN = 0.5;
  function cutFactor() {
    const t = Math.min(1, Math.max(0, (score - CUT_START) / (CUT_END - CUT_START)));
    return 1 - (1 - CUT_MIN) * t;                 // 1.00 → 0.50
  }
  function applyScoreCut(gap) {
    return gap * cutFactor();
  }

  // ---------------- 更新 ----------------
  function update() {
    // 云同昼夜无论状态都动，画面更活
    if (Math.random() < 0.02) spawnCloud();
    clouds.forEach(c => { c.x -= c.s * speed * 0.6; });
    clouds = clouds.filter(c => c.x > -80);

    dayNight++;
    isNight = (Math.floor(dayNight / 900) % 2) === 1;
    if (isNight && stars.length === 0) {
      for (let i = 0; i < 30; i++)
        stars.push({ x: Math.random() * W, y: Math.random() * (GROUND - 60), r: Math.random() * 1.5 + 0.3 });
    }
    if (!isNight) stars = [];

    if (state !== 'play') {
      // 死亡动画：恐龙继续往下掉
      if (state === 'over') deathT++;
      if (state === 'over') {
        if (!dino.grounded) {
          dino.vy += dino.gravity;
          dino.y += dino.vy;
          if (dino.y >= GROUND) { dino.y = GROUND; dino.grounded = true; }
        }
      }
      return;
    }

    // 加速
    if (speed < maxSpeed) speed += 0.00225;   // 加速度 +50%：封頂由 ~89s 縮到 ~59s

    // 跳跃物理
    if (!dino.grounded) {
      dino.vy += dino.gravity;
      dino.y += dino.vy;
      if (dino.y >= GROUND) { dino.y = GROUND; dino.vy = 0; dino.grounded = true; }
    }

    // 跑步动画帧
    if (dino.grounded && !dino.ducking) dino.runFrame += 0.25;

    // 障碍生成
    nextObstacle -= speed;
    if (nextObstacle <= 0) {
      let forced = null;      // null = 普通擲骰；'cactus' / 'bird' = 關卡強制
      let gap;

      if (comboLeft > 0) {
        // 組內下一棵：繼續短間隔；出完先至抽下一張節奏牌
        forced = 'cactus';
        comboLeft--;
        gap = comboLeft > 0 ? comboGap() : rhythmGap().gap;
      } else if (switchPending) {
        // 換鍵關嘅第二棵：同上一棵唔同類型，落地即刻要換鍵
        switchPending = false;
        forced = (lastType === 'bird') ? 'cactus' : 'bird';
        gap = rhythmGap().gap;
      } else {
        const nx = rhythmGap();
        if (nx.kind === 'double') {
          forced = 'cactus';
          // Hardcore 專屬：12% 稀有三連跳（連按三下），組完必定唔再連跳
          comboLeft = (hk() > 0.35 && Math.random() < 0.12) ? 2 : 1;
          gap = comboGap();
        } else if (nx.kind === 'switch') {
          // 呢棵照普通出，下一棵強制相反類型 + 短間隔
          switchPending = true;
          gap = switchGap();
        } else {
          gap = nx.gap;       // tight / steady / breath
        }
      }

      spawnObstacle(forced);
      lastType = obstacles[obstacles.length - 1].type;
      nextObstacle = applyScoreCut(gap);
    }

    // 移动障碍 + 计分 + 碰撞
    obstacles.forEach(o => {
      o.x -= speed;
      if (o.type === 'bird') o.wing += 0.2;
      if (!o.passed && o.x + o.w < dino.x) {
        o.passed = true;
        score += o.type === 'bird' ? 10 : 5;
      }
    });
    obstacles = obstacles.filter(o => o.x > -60);

    distance += speed;
    score += speed * 0.02;
    hardTag.classList.toggle('on', hk() > 0);
    const cf = cutFactor();
    cutTag.classList.toggle('on', score > CUT_START);
    cutTag.textContent = (score >= CUT_END ? '⏱ 極限 ×0.50' : '⏱ 間隔 ×' + cf.toFixed(2));

    if (score > best) { best = Math.floor(score); bestEl.textContent = best; hiEl.textContent = best; localStorage.setItem('dino_best', best); }
    scoreEl.textContent = Math.floor(score);

    // 碰撞检测
    const db = dinoBox();
    for (const o of obstacles) {
      const ob = { x: o.x, y: o.y - o.h, w: o.w, h: o.h };
      if (o.type === 'bird') {
        // 雀仔硬性規則：只有「蹲低」先過得。
        // 幾何上跳到最高點嗰陣隻熊會飛到雀仔上方、rectHit 會變 false，
        // 舊版就係咁俾人「跳過雀仔」。呢度只要 x 重疊且唔係蹲低（企立／跳緊／
        // 跳到頂）一律判撞，唔再靠高度帶碰運氣。
        const xOverlap = db.x < ob.x + ob.w && db.x + db.w > ob.x;
        if (!dino.ducking && xOverlap) { gameOver(); break; }
        if (rectHit(db, ob)) { gameOver(); break; }   // 蹲低仍保留幾何安全網
      } else if (rectHit(db, ob)) {
        gameOver(); break;
      }
    }
  }

  function dinoBox() {
    const h = dino.ducking ? dino.h * 0.55 : dino.h;
    const y = dino.ducking ? GROUND - h : dino.y - dino.h;
    // 碰撞箱略缩细，手感更宽容
    return { x: dino.x + 4, y: y + 3, w: dino.w - 8, h: h - 4 };
  }

  function rectHit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function gameOver() {
    state = 'over';
    deathT = 0;
    dino.dead = true;
    dino.grounded = false;   // 触发一个小弹起再摔落
    dino.vy = -6;
    if (score > best) { best = Math.floor(score); localStorage.setItem('dino_best', best); }
  }

  const BEAR_ASPECT = 352 / 422;
  const BEAR_W0 = 352, BEAR_H0 = 422;
  const LEG_TOP = 310;                    // 原圖入面「腳」開始嗰行
  const LEG_H   = BEAR_H0 - LEG_TOP;      // 112
  const HALF    = BEAR_W0 / 2;            // 左右腳各一半

  // 靈魂：同一張原圖染做淡藍白，似離體咁
  const SOUL = document.createElement('canvas');
  SOUL.width = BEAR_W0; SOUL.height = BEAR_H0;
  const sctx = SOUL.getContext('2d');
  function buildSoul() {
    sctx.clearRect(0, 0, BEAR_W0, BEAR_H0);
    sctx.drawImage(BEAR_IMG, 0, 0, BEAR_W0, BEAR_H0);
    sctx.globalCompositeOperation = 'source-atop';
    const g = sctx.createLinearGradient(0, 0, 0, BEAR_H0);
    g.addColorStop(0, 'rgba(255,255,255,.42)');
    g.addColorStop(1, 'rgba(135,185,255,.58)');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, BEAR_W0, BEAR_H0);
    sctx.globalCompositeOperation = 'source-over';
  }
  if (BEAR_IMG.complete && BEAR_IMG.naturalWidth) buildSoul();
  else BEAR_IMG.addEventListener('load', buildSoul);

  function drawBear(x, yTop, duck, frame, dead) {
    const boxH   = duck ? dino.h * 0.55 : dino.h;
    const bottom = yTop + boxH;                       // 腳底貼返地面
    const dispH  = duck ? dino.h * 0.74 : dino.h * 1.2;
    const dispW  = dispH * BEAR_ASPECT * (duck ? 1.12 : 1);
    const sx = dispW / BEAR_W0, sy = dispH / BEAR_H0;
    const originX = x + (dino.w - dispW) / 2;
    const originY = bottom - dispH + 2 + (dead ? 4 : 0);  // 抵銷原圖底部透明邊；瞓低時再抬少少
    const ready = BEAR_IMG.complete && BEAR_IMG.naturalWidth > 0;
    const ANG = -1.18;                                // 瞓低約 68°

    ctx.save();
    ctx.translate(originX, originY);

    // ---------- 熊本體 ----------
    ctx.save();
    if (dead) {
      ctx.translate(dispW / 2, dispH);
      ctx.rotate(ANG);
      ctx.translate(-dispW / 2, -dispH);
    }
    if (ready) {
      // 頭 + 身：完全唔郁
      ctx.drawImage(BEAR_IMG, 0, 0, BEAR_W0, LEG_TOP,
                    0, 0, dispW, LEG_TOP * sy);

      // 淨係兩隻腳輪流繞「腿根」前後擺；身、頭一動不動，腿根亦唔會甩開
      const swing = Math.floor(frame) % 2 === 0;
      const doRun = !duck && !dead;
      const lift = dispH * 0.045;
      function leg(srcX, destX, rot, up) {
        const px = destX + HALF * sx / 2;
        ctx.save();
        ctx.translate(px, LEG_TOP * sy);
        ctx.rotate(rot);
        ctx.translate(-px, -LEG_TOP * sy);
        ctx.drawImage(BEAR_IMG, srcX, LEG_TOP, HALF, LEG_H,
                      destX, LEG_TOP * sy - up, HALF * sx, LEG_H * sy);
        ctx.restore();
      }
      leg(0,    0,         doRun && swing  ? -0.30 : 0, doRun && swing  ? lift : 0);
      leg(HALF, HALF * sx, doRun && !swing ?  0.30 : 0, doRun && !swing ? lift : 0);
    } else {
      ctx.fillStyle = '#c8a06a'; ctx.fillRect(0, 0, dispW, dispH);
    }
    ctx.restore();

    // ---------- 死咗：瞓低 + 個口吐靈魂 ----------
    if (dead && ready) {
      const cx = dispW / 2, cy = dispH;
      const mx = dispW * 0.5, my = dispH * 0.30;     // 嘴嘅位置
      const vx = mx - cx, vy = my - cy;
      const rx = cx + vx * Math.cos(ANG) - vy * Math.sin(ANG);
      const ry = cy + vx * Math.sin(ANG) + vy * Math.cos(ANG);

      const t = deathT;
      const fade = Math.max(0, 1 - t / 200);
      const sw = dispW * 0.45, sh = dispH * 0.45;     // 原圖 45% 大細（再大啲）
      const fx = rx + sw * 0.22 + t * 0.42 + Math.sin(t * 0.09) * 3;
      const fy = ry - 6 - t * 0.75;

      ctx.save();
      // 口中飄出嘅幾粒靈氣
      ctx.fillStyle = 'rgba(120,175,255,.9)';
      for (let i = 0; i < 4; i++) {
        const q = ((t * 0.9 + i * 10) % 40) / 40;
        ctx.globalAlpha = fade * (1 - q) * 0.85;
        ctx.beginPath();
        ctx.arc(rx + q * 11, ry - 3 - q * 20, 3.2 - q * 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      // 靈魂本體：原圖 30%、帶淡藍光暈，睇得出係同一隻小熊
      ctx.globalAlpha = fade * 0.95;
      ctx.shadowColor = 'rgba(150,195,255,.95)';
      ctx.shadowBlur = 14;
      ctx.drawImage(SOUL, fx - sw / 2, fy - sh / 2, sw, sh);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawCactus(o) {
    ctx.fillStyle = C.cactus;
    const x = o.x, baseY = o.y;
    for (let i = 0; i < o.cluster; i++) {
      const cx = x + i * 21;
      const h = o.h - (i === 1 ? 4 : 0);
      // 主干
      ctx.fillRect(cx + 5, baseY - h, 8, h);
      // 左右手臂
      const armY = baseY - h * 0.55;
      ctx.fillRect(cx, armY, 6, 4);
      ctx.fillRect(cx, armY - 10, 4, 14);
      ctx.fillRect(cx + 13, armY + 6, 6, 4);
      ctx.fillRect(cx + 15, armY - 4, 4, 12);
    }
  }

  function drawBird(o) {
    ctx.fillStyle = C.bird;
    // o.y 係碰撞盒「底部」（同仙人掌一致），畫面要對返盒頂先至唔會偏心
    const x = o.x, y = o.y - o.h;
    // 身体
    ctx.fillRect(x, y, 26, 12);
    // 头
    ctx.fillRect(x + 24, y - 4, 12, 10);
    // 嘴
    ctx.fillRect(x + 34, y - 1, 8, 4);
    // 眼
    ctx.fillStyle = C.bg; ctx.fillRect(x + 30, y - 1, 3, 3);
    ctx.fillStyle = C.bird;
    if (state !== 'over') ctx.fillRect(x + 31, y, 1.5, 1.5);
    // 翅膀（扇动）
    const up = Math.floor(o.wing) % 2 === 0;
    ctx.fillStyle = C.bird;
    if (up) ctx.fillRect(x + 6, y - 10, 14, 6);
    else ctx.fillRect(x + 6, y + 12, 14, 6);
    // 尾
    ctx.fillRect(x - 8, y + 2, 10, 6);
  }

  function drawCloud(c) {
    ctx.fillStyle = isNight ? '#3a3a3a' : C.cloud;
    const s = c.scale;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(s, s);
    ctx.fillRect(10, 8, 40, 12);
    ctx.fillRect(18, 2, 22, 10);
    ctx.fillRect(4, 12, 52, 8);
    ctx.restore();
  }

  function drawGround() {
    ctx.strokeStyle = isNight ? '#777' : C.ink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND + 1);
    ctx.lineTo(W, GROUND + 1);
    ctx.stroke();
    // 地面小碎纹随距离滚动
    ctx.fillStyle = isNight ? '#555' : '#c9c9c9';
    const off = (distance * 0.5) % 24;
    for (let i = -off; i < W; i += 24) {
      ctx.fillRect(i, GROUND + 8, 8, 2);
      ctx.fillRect(i + 12, GROUND + 15, 5, 2);
    }
  }

  function draw() {
    // 背景
    ctx.fillStyle = isNight ? '#2b2b2b' : C.bg;
    ctx.fillRect(0, 0, W, H);

    // 星星
    if (isNight) {
      ctx.fillStyle = '#888';
      stars.forEach(s => {
        ctx.globalAlpha = 0.4 + Math.random() * 0.5;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      });
      ctx.globalAlpha = 1;
    }

    clouds.forEach(drawCloud);
    drawGround();
    obstacles.forEach(o => o.type === 'bird' ? drawBird(o) : drawCactus(o));

    // 主角
    const dy = dino.ducking ? GROUND : dino.y;
    drawBear(dino.x, (dino.dead ? GROUND : dy) - (dino.ducking ? dino.h * 0.55 : dino.h),
             dino.ducking, dino.runFrame, dino.dead);

    // 起始提示
    if (state === 'start') {
      centerText('按 空格 / 點擊  開始', H / 2 - 10);
    }
    if (state === 'over') {
      centerText('G A M E   O V E R', H / 2 - 30, 26);
      centerText('按任意鍵重新開始', H / 2 + 6, 14);
    }
  }

  function centerText(t, y, size) {
    ctx.fillStyle = C.ink;
    ctx.font = (size || 16) + 'px -apple-system, "PingFang HK", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t, W / 2, y);
    ctx.textAlign = 'left';
  }

  // ---------------- 主循环 ----------------
  let last = 0;
  function loop(t) {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------------- 输入 ----------------
  function onJump(e) {
    if (state === 'start') { reset(); return; }
    if (state === 'over') { reset(); return; }
    jump();
  }
  function onDuckStart() {
    if (state === 'play' && dino.grounded) dino.ducking = true;
  }
  function onDuckEnd() { dino.ducking = false; }

  // 键盘
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      onJump();
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      onDuckStart();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowDown') { e.preventDefault(); onDuckEnd(); }
  });

  // 触屏装置：显示萤幕掣
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  // 萤幕掣（按住蹲低、松开起身）
  const btnJump = document.getElementById('btnJump');
  const btnDuck = document.getElementById('btnDuck');
  function bindButton(el, onDown, onUp) {
    const down = e => { e.preventDefault(); el.classList.add('on'); onDown(); };
    const up = e => { e.preventDefault(); el.classList.remove('on'); if (onUp) onUp(); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  }
  bindButton(btnJump, () => onJump(), null);
  bindButton(btnDuck, () => onDuckStart(), () => onDuckEnd());

  // 直接点画面：上半跳、下半蹲（同萤幕掣互补）
  cvs.addEventListener('touchstart', e => {
    e.preventDefault();
    const ty = e.touches[0].clientY;
    const rect = cvs.getBoundingClientRect();
    if (state === 'play' && ty > rect.top + rect.height * 0.6) onDuckStart();
    else onJump();
  }, { passive: false });
  cvs.addEventListener('touchend', e => { e.preventDefault(); onDuckEnd(); }, { passive: false });

  // 电脑鼠标点画面 = 跳
  if (!isTouch) cvs.addEventListener('mousedown', () => onJump());

  // 初始云
  for (let i = 0; i < 3; i++) spawnCloud();
})();
</script>
</body>
</html>
